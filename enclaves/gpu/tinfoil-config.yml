  # deploy-config.template.json (chatml, eos [248046, 248044]).
  # mpk generated in the Tinfoil Models tab 2026-07-18 (5978923008 bytes ≈
  # the ~6 GB above).
  - name: "qwen3.5-9b-gguf"
    repo: "EnclaveHost/qwen3.5-9b-gguf@b42dbc5ad0fa4c9e23d466b8e7138c2cbf5397cf"
    mpk: "b70cb1b66baaf59542b5d478f952fcb4085dfb681deedf9e0420452e2fe6e6be_5978923008_a7a7944b-b900-52c6-a03e-dfb907fe623d"
  # Qwen3.6-27B (dense hybrid-SSM; GGUF arch is qwen35 with
  # full_attention_interval 4, so the pinned LLAMA_COMMIT bec4772f serves it
  # unchanged; CPU e2e smoke-tested on that exact commit 2026-07-23) at
  # unsloth Dynamic Q4_K_XL (~17.6 GB): the mid-size tenant option, ~25.5 GB to
