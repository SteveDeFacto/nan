  - name: "qwen3.6-27b-mtp-gguf"
    repo: "EnclaveHost/qwen3.6-27b-mtp-gguf@e6af0316e51eaf3e12982a566941be224c26ed50"
    mpk: "bc785d661620a4ffd94c65eee8ff27fe981eb6517dfa285b219c014c6dcc8aa9_17921925120_624a9548-dcee-5aa1-8eaa-6d12d0a368a3"
  # Qwen3.8-27B at unsloth Dynamic Q6_K_XL (~25.9 GB): the CODE-WORK 27b, and the
