# Single ingress → supervisor. Only these paths are reachable from outside.
# PROBE-PATH NOTE: this shim exposes "/health", but the supervisor serves its
# health JSON at /v1/health (it registers no bare /health route), so an external
# GET /health 404s. Point external/uptime health probes at /v1/health; the
# per-container Docker healthchecks (worker/manager :8090,:8091 /health) are a
# DIFFERENT, internal endpoint and are unaffected.
shim:
  upstream-port: 8080
  paths:
    - /health
    - /v1/*
    - /availability
    - /x/*
    # app deploys need NO new shim path: /v1/vms/* falls under /v1/* (the
    # supervisor proxies it to the wasm-manager on :8091), and the app's server is reached via /x/*.
